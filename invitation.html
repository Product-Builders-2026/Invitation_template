<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravi Adhithya & Haripritha — Engagement</title>
<meta property="og:title" content="Ravi Adhithya & Haripritha — Engagement Invitation">
<meta property="og:description" content="You are invited to celebrate the engagement of Ravi Adhithya & Haripritha on Sunday, November 1, 2026 at Preethika Mahal, Chennai.">
<meta property="og:image" content="og-preview.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ravi Adhithya & Haripritha — Engagement Invitation">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og-preview.png">
<meta name="description" content="Engagement invitation for Ravi Adhithya & Haripritha — Sunday, November 1, 2026, Preethika Mahal, Chennai.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap');

:root{
  --cream:#f8f0df;
  --paper:#fffaf0;
  --gold:#b58a3b;
  --deep-gold:#7e5b22;
  --maroon:#6d1f2b;
  --green:#314b32;
  --pink:#b95d70;
  --ink:#35251d;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#241d18;
  color:var(--ink);
  font-family:'Cormorant Garamond',serif;
  overflow-x:hidden;
}
button,a{font:inherit}

/* ---------- OPENING ---------- */
#intro{
  min-height:100svh;
  position:fixed;
  inset:0;
  z-index:50;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% 45%, #fff8e8 0%, #e7d1a5 55%, #9e7438 140%);
  transition:opacity 1s ease, visibility 1s ease;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}

.intro-card{
  width:min(88vw,620px);
  min-height:75vh;
  padding:55px 35px;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  border:1px solid rgba(126,91,34,.55);
  box-shadow:0 25px 80px rgba(0,0,0,.28);
  background:
    radial-gradient(circle at center, rgba(255,255,255,.75), rgba(248,240,223,.94)),
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(126,91,34,.025) 4px);
  overflow:hidden;
}
.intro-card:before,.intro-card:after{
  content:"";
  position:absolute;
  width:170px;height:170px;
  border:1px solid var(--gold);
  transform:rotate(45deg);
  opacity:.35;
}
.intro-card:before{top:-100px;left:-100px}
.intro-card:after{bottom:-100px;right:-100px}

.eyebrow{
  letter-spacing:.35em;
  text-transform:uppercase;
  font:500 11px 'Montserrat',sans-serif;
  color:var(--deep-gold);
}
.script{
  font-family:'Great Vibes',cursive;
  color:var(--deep-gold);
  font-weight:400;
}
.intro-card h1{
  margin:15px 0 4px;
  font-size:clamp(46px,9vw,82px);
  font-weight:500;
  line-height:.9;
}
.intro-card p{
  font-size:20px;
  margin:10px 0 30px;
}
.seal{
  width:88px;height:88px;border-radius:50%;
  border:1px solid var(--gold);
  display:grid;place-items:center;
  margin:8px 0 32px;
  color:var(--maroon);
  font-size:32px;
  box-shadow:inset 0 0 0 6px rgba(181,138,59,.08);
}
.open-btn{
  border:1px solid var(--deep-gold);
  background:transparent;
  color:var(--deep-gold);
  padding:15px 32px;
  letter-spacing:.22em;
  text-transform:uppercase;
  font:600 11px 'Montserrat',sans-serif;
  cursor:pointer;
  transition:.3s;
}
.open-btn:hover{background:var(--deep-gold);color:white;transform:translateY(-2px)}
.hint{margin-top:14px!important;font:10px 'Montserrat',sans-serif!important;opacity:.6}

/* ---------- SITE ---------- */
main{background:var(--cream)}
section{
  position:relative;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:90px 20px;
  overflow:hidden;
}
.section-inner{
  width:min(1100px,94vw);
  position:relative;
  z-index:2;
}

/* floral border / hanging garland */
.garland{
  position:absolute;
  top:0;left:0;right:0;
  height:145px;
  pointer-events:none;
}
.strand{
  position:absolute;
  top:0;
  width:2px;
  background:linear-gradient(var(--gold),rgba(181,138,59,.05));
  transform-origin:top;
}
.flower{
  position:absolute;
  bottom:-8px;left:50%;
  transform:translateX(-50%);
  width:22px;height:32px;
}
.flower:before,.flower:after{
  content:"";
  position:absolute;
  width:14px;height:22px;
  border-radius:70% 25% 70% 25%;
  background:var(--pink);
}
.flower:before{left:0;transform:rotate(-28deg)}
.flower:after{right:0;transform:rotate(28deg)}
.leaf{
  position:absolute;
  width:28px;height:12px;
  background:var(--green);
  border-radius:100% 0;
}
.leaf.l{left:-22px;bottom:7px;transform:rotate(-25deg)}
.leaf.r{right:-22px;bottom:7px;transform:scaleX(-1) rotate(-25deg)}

.frame{
  border:1px solid rgba(126,91,34,.6);
  outline:1px solid rgba(126,91,34,.25);
  outline-offset:8px;
}
.ornament{
  color:var(--gold);
  font-size:26px;
  letter-spacing:.2em;
}

/* ---------- HERO ---------- */
#home{
  background:
    radial-gradient(circle at 50% 40%, rgba(255,255,255,.65), transparent 50%),
    linear-gradient(135deg,#f9f2e2,#ead8b5);
}
.hero{
  text-align:center;
  padding:90px 25px;
  max-width:900px;
  margin:auto;
}
.hero .tiny{font:500 12px 'Montserrat',sans-serif;letter-spacing:.3em;color:var(--deep-gold);margin-top:14px;}
.hero h2{
  margin:12px 0 0;
  font-size:clamp(58px,10vw,112px);
  font-weight:500;
  line-height:.82;
}
.names{
  margin:22px 0;
  color:var(--maroon);
  font-size:clamp(28px,5vw,55px);
  letter-spacing:.03em;
}
.names span{font-family:'Great Vibes';font-size:.7em;color:var(--gold)}
.date-line{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:22px;
  font-size:19px;
  margin:22px auto;
}
.date-line i{height:42px;width:1px;background:var(--gold)}
.scroll-note{
  margin-top:50px;
  font:10px 'Montserrat',sans-serif;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--deep-gold);
  animation:breathe 2s infinite;
}
@keyframes breathe{50%{opacity:.35;transform:translateY(5px)}}

/* ---------- STORY ---------- */
#story{background:#f7efdf}
.story-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
  align-items:center;
}
.story-copy h3,.details h3{
  font-size:52px;
  font-weight:500;
  margin:0 0 10px;
  color:var(--maroon);
}
.story-copy p{
  font-size:21px;
  line-height:1.45;
  max-width:520px;
}
.story-card{
  min-height:460px;
  display:grid;
  place-items:center;
  position:relative;
  background:rgba(255,250,240,.6);
  padding:30px;
}
.mandala{
  width:min(330px,70vw);
  aspect-ratio:1;
  border:1px solid var(--gold);
  border-radius:50%;
  display:grid;place-items:center;
  position:relative;
}
.mandala:before,.mandala:after{
  content:"";
  position:absolute;
  inset:25px;
  border:1px solid var(--gold);
  transform:rotate(45deg);
}
.mandala:after{inset:55px;border-radius:50%}
.mandala-center{text-align:center;z-index:2}
.mandala-center .heart{font-size:58px;color:var(--maroon)}
.mandala-center div{font:10px 'Montserrat';letter-spacing:.25em;text-transform:uppercase}

/* ---------- DETAILS ---------- */
#details{
  background:
    radial-gradient(circle at 20% 80%,rgba(185,93,112,.08),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(49,75,50,.08),transparent 30%),
    var(--paper);
}
.details{text-align:center}
.details .lead{font-size:21px;margin-bottom:38px}
.detail-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid rgba(126,91,34,.4);
  border-bottom:1px solid rgba(126,91,34,.4);
  margin:30px auto;
  max-width:900px;
}
.detail{
  padding:35px 20px;
  position:relative;
}
.detail:not(:last-child):after{
  content:"";position:absolute;right:0;top:25%;height:50%;width:1px;background:rgba(126,91,34,.35)
}
.detail small{
  font:10px 'Montserrat';letter-spacing:.2em;text-transform:uppercase;color:var(--deep-gold)
}
.detail strong{display:block;font-size:30px;font-weight:600;color:var(--maroon);margin-top:8px}
.detail em{font-style:normal;font-size:18px}
.venue{
  font-size:29px;
  color:var(--maroon);
  margin-top:18px;
}
.address{font-size:18px;line-height:1.45}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}
.action{
  text-decoration:none;
  border:1px solid var(--gold);
  color:var(--deep-gold);
  padding:12px 20px;
  font:600 10px 'Montserrat';
  letter-spacing:.15em;
  text-transform:uppercase;
  background:transparent;
  cursor:pointer;
}
.action:hover{background:var(--deep-gold);color:#fff}

/* ---------- COUNTDOWN ---------- */
#countdown{
  min-height:auto;
  padding:65px 20px;
  background:var(--maroon);
  color:#fff7e9;
  text-align:center;
}
#countdown .section-inner{max-width:850px}
.count-title{font:10px 'Montserrat';letter-spacing:.3em;text-transform:uppercase;opacity:.75}
.timer{
  display:flex;
  justify-content:center;
  gap:clamp(12px,4vw,45px);
  margin-top:20px;
}
.timer .unit{min-width:70px}
.timer b{display:block;font-family:'Montserrat',sans-serif;font-size:clamp(38px,7vw,70px);font-weight:500;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;line-height:1}
.timer span{font:9px 'Montserrat';letter-spacing:.2em;opacity:.7}

/* ---------- CLOSING ---------- */
#closing{
  min-height:75svh;
  background:linear-gradient(#f8f0df,#e7d0a3);
  text-align:center;
}
.closing-card{padding:60px 25px}
.closing-card h3{font-size:clamp(58px,10vw,100px);margin:0;color:var(--maroon);font-weight:500}
.closing-card p{font-size:23px;max-width:650px;margin:15px auto 35px;line-height:1.4}
.signature{font-family:'Great Vibes';font-size:43px;color:var(--deep-gold)}
footer{text-align:center;padding:18px;background:#211914;color:#e9d9b8;font:9px 'Montserrat';letter-spacing:.2em}

/* ---------- reveal animations ---------- */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}
.reveal.visible{opacity:1;transform:none}

/* ---------- responsive ---------- */
@media(max-width:700px){
  section{padding:75px 15px}
  .story-grid{grid-template-columns:1fr}
  .story-card{min-height:350px}
  .detail-row{grid-template-columns:1fr}
  .detail:not(:last-child):after{right:15%;left:15%;top:auto;bottom:0;width:auto;height:1px}
  .detail{padding:25px}
  .detail strong{font-size:26px}
  .hero h2{font-size:65px}
}

/* ---------- COUPLE PORTRAIT ---------- */
.couple-photo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:28px auto 8px;
  width:min(720px,94vw);
  position:relative;
}
.couple-photo{
  display:block;
  width:min(680px,94vw);
  max-height:480px;
  height:auto;
  object-fit:contain;
  filter:drop-shadow(0 18px 22px rgba(61,40,25,.16));
  animation:coupleFloat 5s ease-in-out infinite;
}
@keyframes coupleFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
@media(max-width:700px){
  .couple-photo-wrap{margin-top:22px}
  .couple-photo{max-height:390px}
}


/* ---------- MOBILE LAYOUT FIX ---------- */
@media (max-width:700px){

  html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  section{
    min-height:auto;
    width:100%;
    padding:115px 14px 60px;
  }

  /* Keep the hanging flowers behind the content instead of over it */
  .garland{
    height:92px;
    z-index:0;
  }

  .section-inner{
    width:100%;
    max-width:100%;
  }

  /* Opening screen */
  #intro{
    padding:12px;
  }

  .intro-card{
    width:100%;
    min-height:calc(100svh - 24px);
    max-height:none;
    padding:45px 20px 35px;
  }

  .intro-card .eyebrow{
    font-size:9px;
    letter-spacing:.22em;
  }

  .intro-card h1{
    font-size:clamp(52px,17vw,72px);
  }

  .intro-card p{
    font-size:17px;
    line-height:1.35;
  }

  .seal{
    width:72px;
    height:72px;
    margin:8px 0 24px;
  }

  .open-btn{
    padding:13px 22px;
  }

  /* First invitation screen */
  #home{
    padding-top:105px;
    padding-bottom:55px;
  }

  .hero{
    width:100%;
    padding:25px 4px 10px;
  }

  .hero .tiny{
    font-size:9px;
    line-height:1.5;
    letter-spacing:.18em;
    max-width:290px;
    margin:0 auto 16px;
  }

  .hero .script{
    font-size:31px !important;
  }

  .hero h2{
    margin:7px 0 0;
    font-size:clamp(55px,18vw,78px);
    line-height:.82;
  }

  .ornament{
    font-size:21px;
    margin:15px 0;
  }

  .names{
    margin:13px auto;
    font-size:clamp(25px,8vw,38px);
    line-height:1.05;
  }

  .date-line{
    width:100%;
    max-width:330px;
    margin:16px auto 0;
    display:grid;
    grid-template-columns:1fr;
    gap:5px;
    font-size:12px;
    line-height:1.3;
    letter-spacing:.12em;
  }

  .date-line i{
    width:32px;
    height:1px;
    margin:3px auto;
  }

  .couple-photo-wrap{
    width:100%;
    max-width:360px;
    margin:20px auto 4px;
    padding:0;
  }

  .couple-photo{
    width:100%;
    max-width:360px;
    max-height:285px;
    height:auto;
    object-fit:contain;
  }

  .scroll-note{
    margin-top:25px;
    font-size:8px;
    letter-spacing:.13em;
  }

  /* Story */
  #story{
    padding-top:85px;
  }

  .story-grid{
    grid-template-columns:1fr;
    gap:28px;
  }

  .story-copy{
    text-align:center;
  }

  .story-copy h3,
  .details h3{
    font-size:clamp(42px,12vw,56px);
    line-height:.95;
  }

  .story-copy p{
    font-size:18px;
    line-height:1.45;
  }

  .story-card{
    min-height:300px;
    padding:20px;
  }

  .mandala{
    width:min(250px,72vw);
  }

  /* Details */
  #details{
    padding-top:85px;
  }

  .details .lead{
    font-size:18px;
    line-height:1.4;
    margin:10px auto 25px;
    max-width:330px;
  }

  .detail-row{
    grid-template-columns:1fr;
    width:100%;
    max-width:340px;
    margin:22px auto;
  }

  .detail{
    padding:21px 12px;
  }

  .detail:not(:last-child):after{
    right:12%;
    left:12%;
    top:auto;
    bottom:0;
    width:auto;
    height:1px;
  }

  .detail strong{
    font-size:25px;
  }

  .detail em{
    font-size:15px;
  }

  .venue{
    font-size:24px;
    line-height:1.1;
  }

  .address{
    font-size:16px;
    line-height:1.4;
  }

  .actions{
    gap:8px;
  }

  .action{
    padding:11px 14px;
    font-size:9px;
    letter-spacing:.10em;
  }

  /* Countdown */
  #countdown{
    padding:48px 12px;
  }

  .count-title{
    font-size:9px;
    line-height:1.5;
    max-width:300px;
    margin:auto;
  }

  .timer{
    gap:8px;
    margin-top:22px;
  }

  .timer .unit{
    min-width:62px;
  }

  .timer b{
    font-size:36px;
  }

  .timer span{
    font-size:8px;
  }

  /* Closing */
  #closing{
    min-height:70svh;
    padding:75px 15px 55px;
  }

  .closing-card{
    padding:45px 18px;
    width:100%;
  }

  .closing-card h3{
    font-size:clamp(55px,17vw,82px);
  }

  .closing-card p{
    font-size:18px;
    line-height:1.4;
  }

  .signature{
    font-size:38px;
  }

  footer{
    font-size:8px;
    line-height:1.5;
    padding:16px 12px;
  }
}

/* Extra-small phones */
@media (max-width:380px){
  .intro-card{
    padding-left:15px;
    padding-right:15px;
  }

  .hero h2{
    font-size:58px;
  }

  .couple-photo{
    max-height:250px;
  }

  .names{
    font-size:24px;
  }

  .timer .unit{
    min-width:55px;
  }

  .timer b{
    font-size:31px;
  }
}


/* ---------- SECOND & THIRD PAGE HEADING FIX ---------- */
@media (max-width:700px){

  /* Give the headings their own safe vertical area */
  #story,
  #details{
    overflow: visible;
  }

  #story .section-inner,
  #details .section-inner{
    width:100%;
    max-width:100%;
    position:relative;
    z-index:5;
  }

  #story .story-copy{
    position:relative;
    z-index:6;
    padding:18px 8px 0;
  }

  #story .story-copy h3{
    position:relative;
    z-index:7;
    margin:20px auto 24px;
    padding:0 8px;
    max-width:340px;
    font-size:clamp(39px,10.5vw,52px);
    line-height:1.08;
    letter-spacing:-.01em;
  }

  #story .story-copy p{
    position:relative;
    z-index:7;
    max-width:330px;
    margin:0 auto;
  }

  #story .floral-border,
  #details .floral-border{
    z-index:0;
    height:72px;
    opacity:.48;
  }

  #details .details{
    position:relative;
    z-index:6;
    padding-top:28px;
  }

  #details .details .eyebrow{
    position:relative;
    z-index:7;
    margin-bottom:16px;
  }

  #details .details h3{
    position:relative;
    z-index:7;
    max-width:340px;
    margin:14px auto 20px;
    padding:0 10px;
    font-size:clamp(39px,10.5vw,53px);
    line-height:1.08;
    letter-spacing:-.01em;
  }

  #details .details .lead{
    position:relative;
    z-index:7;
    margin-top:0;
  }
}


/* ---------- FINAL MOBILE TOP-SPACING FIX ---------- */
@media (max-width:700px){

  /* The hanging floral decoration gets its own space.
     Nothing below it is allowed to occupy the same area. */
  #story,
  #details{
    padding-top:170px !important;
  }

  #story .garland,
  #details .garland{
    height:82px;
    z-index:0;
    overflow:hidden;
    opacity:.72;
  }

  #story .section-inner,
  #details .section-inner{
    margin-top:0;
    padding-top:0;
  }

  #story .story-copy,
  #details .details{
    padding-top:0 !important;
    margin-top:0 !important;
  }

  #story .story-copy .eyebrow,
  #details .details .eyebrow{
    display:block;
    position:relative;
    margin:0 auto 20px !important;
    padding:0;
    line-height:1.5;
    text-align:center;
  }

  #story .story-copy h3,
  #details .details h3{
    display:block;
    position:relative;
    margin:0 auto 24px !important;
    padding:0 10px;
    line-height:1.12 !important;
    max-width:340px;
    text-align:center;
  }

  #story .story-copy p,
  #details .details .lead{
    position:relative;
    margin-left:auto;
    margin-right:auto;
  }

  /* Keep the two headings comfortably separated from the decoration
     even on very small phones. */
  @media (max-width:380px){
    #story,
    #details{
      padding-top:155px !important;
    }

    #story .story-copy .eyebrow,
    #details .details .eyebrow{
      margin-bottom:18px !important;
      font-size:9px;
    }

    #story .story-copy h3,
    #details .details h3{
      font-size:40px !important;
      line-height:1.14 !important;
    }
  }
}


/* =========================================================
   FINAL RESPONSIVE LAYOUT
   One layout that adapts cleanly to desktop + mobile.
   ========================================================= */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

img {
  max-width: 100%;
}

section {
  width: 100%;
}

.section-inner {
  width: min(1060px, calc(100% - 40px));
  max-width: 1060px;
}

/* Keep decorative florals visually behind content */
.floral-border {
  z-index: 0 !important;
}

.hero,
.story-grid,
.details,
.rsvp-grid,
.closing-card {
  position: relative;
  z-index: 5;
}

/* Couple image */
.couple-photo-wrap {
  width: min(620px, 92vw);
  margin: clamp(18px, 3vw, 34px) auto 4px;
}

.couple-photo {
  display: block;
  width: 100%;
  max-height: min(470px, 48vh);
  object-fit: contain;
}

/* ---------------- DESKTOP ---------------- */
@media (min-width: 761px) {

  section {
    min-height: 660px;
    padding: 120px 20px 90px;
  }

  #home {
    padding-top: 80px;
  }

  .hero {
    padding-top: 45px;
  }

  .hero .tiny {
    margin-bottom: 20px;
  }

  .hero h2 {
    margin: -4px 0 12px;
  }

  .date-line {
    flex-wrap: wrap;
  }

  #story {
    padding-top: 125px;
  }

  #story .story-copy {
    padding-top: 15px;
  }

  #details {
    padding-top: 125px;
  }

  #details .details {
    padding-top: 10px;
  }

  #rsvp {
    padding-top: 115px;
  }

  .couple-photo-wrap {
    max-width: 620px;
  }
}

/* ---------------- TABLET / MOBILE ---------------- */
@media (max-width: 760px) {

  section {
    min-height: auto;
    padding: 125px 16px 65px;
  }

  .section-inner {
    width: min(100%, 560px);
  }

  /* Never allow the decorative top border to overlap content */
  .floral-border {
    height: 75px;
    opacity: .48;
  }

  /* HOME */
  #home {
    min-height: 100svh;
    padding: 100px 14px 45px;
    display: flex;
    align-items: center;
  }

  #home .hero {
    width: 100%;
    padding: 20px 0 0;
  }

  .hero .tiny {
    margin-top:12px;
    max-width: 300px;
    margin: 0 auto 17px;
    font-size: 9px;
    line-height: 1.5;
  }

  .hero .script {
    font-size: clamp(30px, 8vw, 42px);
  }

  .hero h2 {
    margin: 5px 0 0;
    font-size: clamp(58px, 17vw, 88px);
    line-height: .86;
  }

  .names {
    margin: 14px auto 0;
    font-size: clamp(24px, 7.5vw, 40px);
    line-height: 1.1;
  }

  .date-line {
    width: min(330px, 100%);
    margin: 17px auto 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
    font-size: 9px;
    line-height: 1.4;
  }

  .date-line i {
    width: 26px;
    height: 1px;
    margin: 3px auto;
  }

  .couple-photo-wrap {
    width: min(360px, 92vw);
    margin: 18px auto 0;
  }

  .couple-photo {
    max-height: 300px;
  }

  .scroll-note {
    margin-top: 22px;
    font-size: 8px;
  }

  /* STORY */
  #story {
    padding-top: 130px;
    padding-bottom: 65px;
